<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LogiRide - Réseau Trans'Cab</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<style>
:root{--bg:#2e1a47;--side:#24143a;--card:#38235a;--line:#523a7c;--tx:#f4eefc;--mu:#bba9d8;--ac:#a98bff;--acx:#1d0f33;--rd:#ff7a88;--ok:#4ade80;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Segoe UI",system-ui,sans-serif;display:flex;min-height:100vh;padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(46,26,71,.78),rgba(46,26,71,.88)),url('fond.jpg') center/cover no-repeat}
nav{width:84px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 0;position:sticky;top:0;height:100vh}
nav a{width:68px;padding:9px 0;border-radius:12px;text-align:center;color:var(--mu);font-size:12px;cursor:pointer}
nav a b{display:block;font-size:20px;font-weight:400}nav a.on{background:var(--ac);color:var(--acx)}
nav .lg{font-weight:800;color:var(--ac);margin-bottom:10px}
main{flex:1;max-width:1200px;margin:0 auto;padding:26px 28px 60px;min-width:0}
h1{font-size:28px;margin:0}h2{font-size:17px;margin:0 0 12px}.sub{color:var(--mu);margin:2px 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.p{background:var(--ac);color:var(--acx);border-color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.ln{display:inline-block;min-width:54px;text-align:center;font-weight:800;font-size:17px;border-radius:9px;padding:6px 8px}
.sv{display:flex;align-items:center;gap:14px;padding:12px 4px;border-top:1px solid var(--line);cursor:pointer}
.sv:hover{background:rgba(255,255,255,.05)}.sv .i{flex:1;min-width:0}.sv small{color:var(--mu);display:block}
.tm{font-weight:700;font-variant-numeric:tabular-nums}
.tag{font-size:12px;font-weight:700;border-radius:20px;padding:2px 10px;background:rgba(245,185,66,.18);color:#f5b942}
.tag.ok{background:rgba(74,222,128,.16);color:var(--ok)}
.tabs{display:inline-flex;background:var(--side);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px}
.tabs button{border:0;background:none;color:var(--mu);font:inherit;font-weight:600;padding:7px 14px;border-radius:9px;cursor:pointer}
.tabs button.on{background:var(--card);color:var(--tx)}
select,input,textarea{background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit}
textarea{width:100%;min-height:110px}input[type=color]{padding:2px;height:34px;width:46px}
label{display:block;font-weight:600;font-size:14px;margin-bottom:10px}label input,label select{margin-top:4px}
.grid{display:grid;grid-template-columns:1fr 2fr;gap:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:14px 0}
.stats div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}.stats small{color:var(--mu);display:block}.stats b{font-size:20px}
.tl{border-left:2px solid var(--ac);margin:8px 0 8px 6px;padding-left:16px;max-height:34vh;overflow:auto}.tl p{margin:0 0 10px}.tl small{color:var(--mu)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(110px,1fr));gap:6px;min-width:800px}
.cal .h{font-weight:700;color:var(--mu);font-size:13px;text-align:center}
.day{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px;min-height:92px;font-size:12px}
.day.td{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}.day.x{opacity:.4}
.dn{font-weight:700;color:var(--mu);margin-bottom:4px}
.chip{display:flex;align-items:center;gap:4px;background:rgba(169,139,255,.18);border:1px solid var(--ac);border-radius:6px;padding:3px 4px;margin-bottom:3px;cursor:pointer;font-size:11px}
.chip .ln{min-width:0;font-size:12px;padding:1px 5px}
.mnav{gap:14px}.mnav b{min-width:150px;text-align:center;font-size:17px}
.kpi{display:grid;grid-template-columns:repeat(6,1fr);border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card);margin-bottom:16px}
.kpi div{padding:12px 14px;border-left:1px solid var(--line)}.kpi div:first-child{border-left:0;background:var(--side)}
.kpi small{display:block;text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:700;color:var(--mu)}
.kpi b{display:block;font-size:24px}.kpi span{font-size:12px;color:var(--mu)}
.hgrid{display:grid;grid-template-columns:2fr 1fr;gap:16px;align-items:start}
.jr{display:flex;gap:14px;align-items:center;border-left:3px solid var(--ac);padding:8px 0 8px 12px;margin-bottom:8px}
.jd{min-width:96px}.jl{flex:1;min-width:0}
.js{display:flex;gap:8px;align-items:center;padding:3px 0;cursor:pointer}.js small{margin-left:auto;color:var(--mu)}
.jt{white-space:nowrap}
.wk{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.wk small{display:block;color:var(--mu)}
.bar{width:90px;height:6px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%}
.mu{color:var(--mu);font-size:12px}
.scr{overflow-x:auto}
.msgs{display:flex;flex-direction:column;gap:10px;max-height:46vh;overflow:auto;margin-bottom:12px}
.m{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;max-width:80%}.m.me{align-self:flex-end;background:rgba(169,139,255,.2)}
.m.imp{border-color:var(--rd)}.m small{color:var(--mu)}
.au{max-width:420px;margin:6vh auto 0}.au input{width:100%}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--rd);min-height:20px;margin:0 0 10px;font-size:14px}
.sw{background:none;border:0;color:var(--ac);font:inherit;font-weight:600;cursor:pointer}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:16px;width:min(560px,92vw);padding:22px;max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.6)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--rd);color:#2b0a10;padding:10px 16px;border-radius:10px;font-weight:600;display:none;z-index:9;max-width:90vw}
#logo{position:fixed;top:5px;left:10px;width:146px;height:56px;object-fit:contain;z-index:6}body.in #logo{left:88px}
#clock{position:fixed;top:16px;right:26px;text-align:right;line-height:1.1;z-index:4;pointer-events:none;font-variant-numeric:tabular-nums;text-shadow:0 1px 6px rgba(0,0,0,.5)}
#clock b{display:block;font-size:36px;font-weight:800}#clock span{font-size:13px;color:var(--mu)}
@media(max-width:1000px){.kpi{grid-template-columns:repeat(3,1fr)}.kpi div:nth-child(4){border-left:0}.hgrid{grid-template-columns:1fr}}
@media(max-width:760px){nav{position:fixed;bottom:0;top:auto;width:100%;height:auto;flex-direction:row;justify-content:space-around;z-index:5;border-right:0;border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}nav a{width:auto;flex:1;font-size:10px}nav a b{font-size:18px}nav .lg{display:none}main{padding:44px 14px 100px}.grid{grid-template-columns:1fr}#clock{top:8px;right:12px}#logo,body.in #logo{width:90px;height:30px;top:8px;left:10px}#clock b{font-size:22px}#clock span{display:none}.kpi{grid-template-columns:repeat(2,1fr)}.kpi div{border-left:0;border-top:1px solid var(--line)}}
@media(min-width:761px) and (max-width:1560px){main{padding-top:76px}}
#sheet{display:none;width:100%}
.sh{font-family:"Segoe UI",system-ui,sans-serif;color:#000;background:#fff;padding:4mm}
.sh h1{font-size:22px;margin:0;color:#000}.sh p{margin:2px 0 0;color:#444}
.shh{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #000;padding-bottom:8px;margin-bottom:12px}
.shn{border:3px solid #000;padding:4px 16px;text-align:center}.shn small{display:block;font-size:10px;letter-spacing:.15em}.shn b{font-size:26px}
.shg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #000;margin-bottom:12px}
.shg div{padding:6px 8px;border-left:1px solid #000;min-height:48px}.shg div:first-child{border-left:0}
.shg small,.shs small{display:block;font-size:10px;letter-spacing:.1em;color:#444;text-transform:uppercase;margin-bottom:2px}.shg b{font-size:15px}
.sh table{width:100%;border-collapse:collapse;margin-bottom:12px}.sh th,.sh td{border:1px solid #000;padding:5px 8px;text-align:left;font-size:13px}
.sh th{background:#000;color:#fff;font-size:11px;letter-spacing:.08em}
.shs{display:grid;grid-template-columns:2fr 1fr 1fr;border:1px solid #000;min-height:120px}.shs div{padding:6px 8px;border-left:1px solid #000}.shs div:first-child{border-left:0}
.shf{margin-top:10px;font-size:10px;color:#444;display:flex;justify-content:space-between}
@page{size:A4;margin:10mm}
@media print{:root{--bg:#fff;--card:#fff;--side:#fff;--tx:#000;--mu:#444;--line:#999}nav,#clock,#toast,.noprint{display:none!important}body::before{display:none}.sh,.sh *{-webkit-print-color-adjust:exact;print-color-adjust:exact}body.ps>*:not(#sheet){display:none!important}body.ps #sheet{display:block}}
</style>
</head>
<body>
<nav id="nav" aria-label="Navigation principale"></nav>
<main id="app"></main>
<dialog id="dlg"></dialog>
<div id="toast" role="alert"></div>
<div id="sheet"></div>
<div id="clock" aria-live="off"></div>
<img id="logo" src="logo.png" alt="LogiRide" onerror="this.style.display='none'">
<script>
const sb=supabase.createClient('https://joubhbfkankatgybkixq.supabase.co','sb_publishable_obT3TbD0d81BWWxGOlOmXw_h_ZUhLY9');
const $=s=>document.querySelector(s);
const FOOT='<p class="sub" style="font-size:12px;margin:24px 0 0;text-align:center">LogiRide version 0.2 beta &copy; LogiSync</p>';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me=null,L=[],ST=[],SV=[],MG=[],PR={},tab='mine',fl='Toutes',adm='lines',amode='login',live=false,pmo=0,hmo=0;
const NAV=[['journee','▦','Journée'],['services','🚌','Services'],['planning','▤','Planning'],['heures','◷','Mes heures'],['messages','✉','Messages']];
const view=()=>(location.hash||'#journee').slice(1);
const hm=t=>(t||'').slice(0,5);
const tmin=t=>{const[h,m]=hm(t).split(':').map(Number);return h*60+m};
const amp=(a,b)=>{const d=(tmin(b)-tmin(a)+1440)%1440,h=Math.floor(d/60),m=d%60;return h?`${h} h ${String(m).padStart(2,'0')}`:`${m} min`};
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>iso(new Date());
const fd=d=>new Date(d+'T12:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
const lb=c=>{const x=L.find(y=>y.code===c);return `<span class="ln" style="background:${esc(x?x.bg:'#888')};color:${esc(x?x.fg:'#111')}">${esc(c)}</span>`};
const dlg=h=>{$('#dlg').innerHTML=h;$('#dlg').showModal()};
const close=()=>$('#dlg').close();
function toast(m,ok){const t=$('#toast');t.style.background=ok?'var(--ok)':'var(--rd)';t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',4500)}
const twice=(b,fn)=>{b.onclick=()=>{if(!b.dataset.c){b.dataset.c=1;b.textContent='Confirmer la suppression';return}fn()}};
async function act(p){const{error}=await p;if(error){toast(error.code==='23503'?'Impossible : des services utilisent encore cette ligne.':error.message);return false}await load();render();return true}

async function load(){
 const r=await Promise.all([sb.from('lines').select('*').order('code'),sb.from('stops').select('*').order('pos'),sb.from('services').select('*').order('day').order('start_time'),sb.from('messages').select('*').order('created_at').limit(100),sb.from('profiles').select('id,prenom,nom,matricule,role')]);
 const e=r.find(x=>x.error);if(e)toast(e.error.message);
 L=r[0].data||[];ST=r[1].data||[];SV=r[2].data||[];MG=r[3].data||[];PR=Object.fromEntries((r[4].data||[]).map(p=>[p.id,p]));
}
async function enter(id){
 let{data}=await sb.from('profiles').select('*').eq('id',id).maybeSingle();
 if(!data){await new Promise(r=>setTimeout(r,800));data=(await sb.from('profiles').select('*').eq('id',id).maybeSingle()).data}
 me=data||{id,prenom:'',nom:'',role:'driver'};await load();subscribe();render();
}
function subscribe(){
 if(live)return;live=true;
 sb.channel('live').on('postgres_changes',{event:'*',schema:'public',table:'messages'},async()=>{
  MG=(await sb.from('messages').select('*').order('created_at').limit(100)).data||[];if(view()==='messages')paintMsgs()})
 .on('postgres_changes',{event:'*',schema:'public',table:'services'},async()=>{
  SV=(await sb.from('services').select('*').order('day').order('start_time')).data||[];if(me&&!$('#dlg').open&&view()!=='messages')render()}).subscribe();
}

function authView(){
 const su=amode==='signup';$('#nav').style.display='none';document.body.classList.remove('in');
 $('#app').innerHTML=`<div class="au card"><h1>${su?'Créer un compte':'Connexion à LogiRide'}</h1><p class="sub">${su?'Rejoins ton centre bus.':'Connecte-toi à ton espace conducteur LogiRide.'}</p><form id="af" novalidate>${su?'<div class="two"><label>Prénom<input id="fp" autocomplete="given-name"></label><label>Nom<input id="fn" autocomplete="family-name"></label></div><label>Matricule<input id="fm" placeholder="ex. LSTCXXX (il sera vérifié)"></label>':''}<label>E-mail<input id="fe" type="email" placeholder="ex. xyz@exemple.com (il servira en cas de problème)" autocomplete="username"></label><label>Mot de passe<input id="fw" type="password" autocomplete="${su?'new-password':'current-password'}"></label>${su?'<label>Confirmer le mot de passe<input id="fc" type="password" autocomplete="new-password"></label>':''}<p class="err" id="er" role="alert"></p><button class="btn p" style="width:100%">${su?'Créer mon compte':'Se connecter'}</button></form><p class="sub" style="margin:16px 0 0;text-align:center">${su?'Déjà un compte ?':'Pas encore de compte ?'} <button class="sw" id="sw">${su?'Se connecter':'Créer un compte'}</button></p></div>`;
 $('#app').insertAdjacentHTML('beforeend',FOOT);
 $('#sw').onclick=()=>{amode=su?'login':'signup';authView()};
 $('#af').onsubmit=async e=>{
  e.preventDefault();const er=m=>$('#er').textContent=m,email=$('#fe').value.trim(),pw=$('#fw').value;
  if(!email||!pw)return er('Renseigne ton e-mail et ton mot de passe.');
  if(su){
   const p=$('#fp').value.trim(),n=$('#fn').value.trim(),m=$('#fm').value.trim();
   if(!p||!n||!m)return er('Renseigne ton prénom, ton nom et ton matricule.');
   if(pw.length<8)return er('Le mot de passe doit contenir au moins 8 caractères.');
   if(pw!==$('#fc').value)return er('Les deux mots de passe sont différents.');
   const{data,error}=await sb.auth.signUp({email,password:pw,options:{data:{prenom:p,nom:n,matricule:m}}});
   if(error)return er(error.message);
   if(!data.session){amode='login';authView();$('#er').textContent='Compte créé. Confirme ton e-mail, puis connecte-toi.';return}
   await enter(data.user.id);
  }else{
   const{data,error}=await sb.auth.signInWithPassword({email,password:pw});
   if(error)return er('Identifiants incorrects ou e-mail non confirmé.');
   await enter(data.user.id);
  }
 };
}

function nav(v){
 const a=[...NAV];if(me.role==='admin')a.push(['admin','⚙','Admin']);a.push(['profil','☺','Profil']);a.push(['quitter','⎋','Quitter']);
 $('#nav').style.display='';document.body.classList.add('in');
 $('#nav').innerHTML='<div class="lg">V0.2b</div>'+a.map(([k,i,t])=>`<a tabindex="0" role="link" data-r="${k}" class="${v===k?'on':''}"><b>${i}</b>${t}</a>`).join('');
 document.querySelectorAll('nav a').forEach(x=>{x.onclick=()=>location.hash=x.dataset.r;x.onkeydown=e=>{if(e.key==='Enter')x.click()}});
}
function row(s,pr){const p=!!s.driver_id;return `<div class="sv" tabindex="0" data-id="${esc(s.id)}">${lb(s.line_code)}<div class="i"><b>Service ${esc(s.id)}</b> · ${fd(s.day)}<small>${esc(s.detail)} · amplitude ${amp(s.start_time,s.end_time)}</small></div><span class="tm">${hm(s.start_time)} – ${hm(s.end_time)}</span>${pr?`<button class="btn" data-pr="${esc(s.id)}" style="padding:4px 10px;font-size:13px">🖨 Imprimer</button>`:''}<span class="tag ${p?'ok':''}">${p?'Planifié':'À pourvoir'}</span></div>`}
const at=(d,t)=>new Date(d+'T'+hm(t)+':00');
const endOf=s=>{const e=at(s.day,s.end_time);if(tmin(s.end_time)<=tmin(s.start_time))e.setDate(e.getDate()+1);return e};
const mine=()=>SV.filter(s=>s.driver_id===me.id&&endOf(s)>new Date());
const open=()=>SV.filter(s=>!s.driver_id&&at(s.day,s.start_time)>new Date());

function journee(){
 const m=mine().slice(0,3),imp=[...MG].reverse().find(x=>x.important);
 return `<h1>Bonjour ${esc(me.prenom)}, bienvenue sur votre espace LogiRide !</h1><p class="sub">${new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p>
 ${imp?`<div class="card" style="border-color:var(--rd)"><h2>Message important</h2>${esc(imp.body)}<p class="sub" style="margin:6px 0 0">${esc(imp.author_name)}</p></div>`:''}
 <div class="grid"><div class="card"><h2>À pourvoir</h2><p style="font-size:34px;font-weight:800;margin:0">${open().length}</p><p class="sub" style="margin:0 0 12px">services libres</p><button class="btn p" onclick="location.hash='services'">Voir les services</button></div>
 <div class="card"><h2>Mes prochains services</h2>${m.length?m.map(row).join(''):'<p class="sub">Aucun service prévu. Prends-en un dans « À pourvoir ».</p>'}</div></div>`;
}
function services(){
 const list=tab==='mine'?mine():open().filter(s=>fl==='Toutes'||s.line_code===fl);
 return `<h1>Services Trans'Cab</h1><p class="sub">Vos services et ceux à pourvoir.</p>
 <div class="tabs"><button data-t="mine" class="${tab==='mine'?'on':''}">Mes services (${mine().length})</button><button data-t="open" class="${tab==='open'?'on':''}">Disponibles (${open().length})</button></div>
 <div class="card">${tab==='open'?`<label>Ligne <select id="fl">${['Toutes',...L.map(x=>x.code)].map(l=>`<option ${l===fl?'selected':''}>${esc(l)}</option>`).join('')}</select></label>`:''}${list.length?list.map(s=>row(s,tab==='mine')).join(''):'<p class="sub">Rien à afficher pour le moment.</p>'}</div>`;
}

const mstart=o=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+o);return d};
const mlabel=d=>{const s=d.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});return s[0].toUpperCase()+s.slice(1)};
const mnav=(k,o)=>`<div class="row mnav"><button class="btn" data-${k}="-1" aria-label="Mois précédent">‹</button><b>${mlabel(mstart(o))}</b><button class="btn" data-${k}="1" aria-label="Mois suivant">›</button></div>`;
const myM=o=>{const d=mstart(o),y=d.getFullYear(),m=d.getMonth();return SV.filter(s=>{if(s.driver_id!==me.id)return false;const t=at(s.day,s.start_time);return t.getFullYear()===y&&t.getMonth()===m}).sort((a,b)=>(a.day+a.start_time).localeCompare(b.day+b.start_time))};
function planning(){
 const d=mstart(pmo),y=d.getFullYear(),m=d.getMonth(),n=new Date(y,m+1,0).getDate(),off=(d.getDay()+6)%7,c=[];
 for(let i=0;i<off;i++)c.push('<div></div>');
 for(let k=1;k<=n;k++){const dt=iso(new Date(y,m,k)),l=SV.filter(s=>s.day===dt&&s.driver_id===me.id);
  c.push(`<div class="day ${dt===today()?'td':''}"><div class="dn">${k}</div>${l.map(s=>`<div class="chip" tabindex="0" data-id="${esc(s.id)}">${lb(s.line_code)}<span>${hm(s.start_time)}–${hm(s.end_time)}</span></div>`).join('')}</div>`)}
 return `<h1>Planning</h1><p class="sub">Tes services du mois.</p><div style="margin-bottom:14px">${mnav('mp',pmo)}</div><div class="card scr"><div class="cal">${['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map(x=>`<div class="h">${x}</div>`).join('')}${c.join('')}</div></div>`;
}

const dur=s=>(tmin(s.end_time)-tmin(s.start_time)+1440)%1440;
const fh=m=>Math.floor(m/60)+' h '+String(m%60).padStart(2,'0');
const fh2=m=>m%60?`${Math.floor(m/60)} h ${String(m%60).padStart(2,'0')}`:`${m/60} h`;
function hours(){
 const now=new Date(),mm=now.getMonth(),yy=now.getFullYear();
 const my=SV.filter(s=>s.driver_id===me.id),done=my.filter(s=>endOf(s)<=now);
 const sum=a=>a.reduce((t,s)=>t+dur(s),0);
 return{mois:sum(done.filter(s=>{const d=at(s.day,s.start_time);return d.getMonth()===mm&&d.getFullYear()===yy})),total:sum(done),venir:sum(my.filter(s=>endOf(s)>now))};
}
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=(h+l-7*m+114)%31+1;return new Date(y,mo-1,da)}
const isFerie=ds=>{const y=+ds.slice(0,4);if(['01-01','05-01','05-08','07-14','08-15','11-01','11-11','12-25'].includes(ds.slice(5)))return true;const e=easter(y);return[1,39,50].some(n=>iso(new Date(y,e.getMonth(),e.getDate()+n))===ds)};
const isDim=ds=>{const[y,m,d]=ds.split('-').map(Number);return new Date(y,m-1,d).getDay()===0};
const nuit=s=>{const a=tmin(s.start_time),b=a+dur(s),ov=(x,y)=>Math.max(0,Math.min(b,y)-Math.max(a,x));return ov(-180,360)+ov(1260,1800)};
function heures(){
 const d=mstart(hmo),y=d.getFullYear(),m=d.getMonth(),now=new Date(),inM=myM(hmo),my=SV.filter(s=>s.driver_id===me.id);
 const sum=a=>a.reduce((t,s)=>t+dur(s),0),tot=sum(inM),done=sum(inM.filter(s=>endOf(s)<=now));
 const form=sum(inM.filter(s=>/formation/i.test(s.detail||''))),nt=inM.reduce((t,s)=>t+nuit(s),0);
 const fs=inM.filter(s=>isDim(s.day)||isFerie(s.day)),fj=new Set(fs.map(s=>s.day)).size;
 const days=[...new Set(inM.map(s=>s.day))];
 const f0=new Date(y,m,1);f0.setDate(1-((f0.getDay()+6)%7));
 const wk=[];for(let w=new Date(f0);w<=new Date(y,m+1,0);w.setDate(w.getDate()+7)){const a=iso(w),e=new Date(w);e.setDate(e.getDate()+6);const b=iso(e);wk.push({a,b,h:sum(my.filter(s=>s.day>=a&&s.day<=b))})}
 return `<h1>Mes heures</h1><p class="sub">Tes heures de service, jour par jour et semaine par semaine.</p>
 <div class="row noprint" style="justify-content:space-between;margin-bottom:12px">${mnav('mh',hmo)}<div class="row"><button class="btn" id="csv">⭳ CSV</button><button class="btn" id="prt">⎙ Imprimer / PDF</button></div></div>
 <p class="sub" style="font-size:13px">Chaque service compte de la prise de service à la fin de service ; les formations comptent aussi, formateur compris. Nuit : part entre 21 h et 6 h.</p>
 <div class="kpi"><div><small>Total du mois</small><b>${fh2(tot)}</b><span>${fh2(done)} effectuées · ${fh2(tot-done)} à venir</span></div><div><small>Services</small><b>${inM.length}</b><span>${fh2(tot)}</span></div><div><small>Formations</small><b>${fh2(form)}</b><span>formateur compris</span></div><div><small>Nuit</small><b>${fh2(nt)}</b><span>de 21 h à 6 h</span></div><div><small>Dimanches et fériés</small><b>${fh2(sum(fs))}</b><span>${fj} jour${fj>1?'s':''} travaillé${fj>1?'s':''}</span></div><div><small>Congés</small><b>0</b><span>jour</span></div></div>
 <div class="hgrid"><div class="card"><h2>Jour par jour</h2>${days.length?days.map(dd=>{const l=inM.filter(s=>s.day===dd);return `<div class="jr"><b class="jd">${fd(dd)}</b><div class="jl">${l.map(s=>`<div class="js" tabindex="0" data-id="${esc(s.id)}"><span>🚌</span><span>Service <b>${esc(s.id)}</b> · ligne ${esc(s.line_code)} · ${hm(s.start_time)}–${hm(s.end_time)}</span><small>${fh2(dur(s))}</small></div>`).join('')}</div><b class="jt">${fh2(sum(l))}</b></div>`}).join(''):'<p class="sub">Aucun service ce mois-ci.</p>'}</div>
 <div class="card"><div class="row" style="justify-content:space-between"><h2>Semaines</h2><span class="mu">règle : 48 h au plus</span></div>${wk.map(w=>`<div class="wk"><div><b>Semaine du ${fd(w.a)}</b><small>au ${fd(w.b)}</small></div><div class="row" style="flex-wrap:nowrap;gap:10px"><div class="bar"><i style="width:${Math.min(100,w.h/28.8)}%;background:${w.h>2880?'var(--rd)':'var(--ok)'}"></i></div><b>${fh2(w.h)}</b></div></div>`).join('')}</div></div>`;
}
function csv(){
 const r=myM(hmo),d=mstart(hmo),t='Date;Service;Ligne;Début;Fin;Durée (h)\n'+r.map(s=>[s.day,s.id,s.line_code,hm(s.start_time),hm(s.end_time),(dur(s)/60).toFixed(2).replace('.',',')].join(';')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download=`heures-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}.csv`;a.click();
}

const msgHtml=()=>MG.map(m=>`<div class="m ${m.author_id===me.id?'me':''} ${m.important?'imp':''}"><small>${esc(m.author_name)} · ${new Date(m.created_at).toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}${m.important?' · important':''}</small><br>${esc(m.body)}</div>`).join('')||'<p class="sub">Aucun message.</p>';
function paintMsgs(){const e=$('#ms');if(e){e.innerHTML=msgHtml();e.scrollTop=e.scrollHeight}}
function messages(){
 return `<h1>Messagerie interne LogiRide</h1><p class="sub">Régulation et équipe du dépôt Trans'Cab.</p><div class="card"><div class="msgs" id="ms">${msgHtml()}</div><form id="mf" class="row" style="flex-wrap:nowrap"><input id="mi" style="flex:1" placeholder="Écrire un message" aria-label="Message">${me.role==='admin'?'<label style="margin:0;white-space:nowrap"><input type="checkbox" id="mx"> Important</label>':''}<button class="btn p">Envoyer</button></form></div>`;
}

function detail(id){
 const s=SV.find(x=>x.id===id);if(!s)return;
 const l=L.find(x=>x.code===s.line_code)||{},pts=[l.terminus_a,...ST.filter(x=>x.line_code===s.line_code).map(x=>x.name),l.terminus_b].filter(Boolean);
 dlg(`<div class="row">${lb(s.line_code)}<h2 style="margin:0">Service ${esc(s.id)}</h2></div><p class="sub">${fd(s.day)} · ${esc(s.detail)}</p>
 <div class="stats"><div><small>Début</small><b>${hm(s.start_time)}</b></div><div><small>Fin</small><b>${hm(s.end_time)}</b></div><div><small>Amplitude</small><b>${amp(s.start_time,s.end_time)}</b></div></div>
 <h2>Arrêts de la ligne</h2><div class="tl">${pts.length?pts.map((p,i)=>`<p><b>${esc(p)}</b>${i===0?'<small> · terminus de départ</small>':i===pts.length-1?'<small> · terminus d’arrivée</small>':''}</p>`).join(''):'<p class="sub">Aucun arrêt défini.</p>'}</div>
 <div class="row" style="justify-content:flex-end"><button class="btn" onclick="close()">Fermer</button>${s.driver_id===me.id?'<button class="btn" id="pr">🖨 Imprimer</button>':''}${me.role==='admin'?'<button class="btn" id="ed">Modifier</button>':''}${!s.driver_id?'<button class="btn p" id="take">Prendre ce service</button>':s.driver_id===me.id?'<button class="btn" id="drop" style="color:var(--rd)">Rendre mon service</button>':''}</div>`);
 const g=i=>$(i);
 if(g('#take'))g('#take').onclick=async()=>{if(await act(sb.from('services').update({driver_id:me.id}).eq('id',id).is('driver_id',null)))close()};
 if(g('#drop'))g('#drop').onclick=async()=>{if(await act(sb.from('services').update({driver_id:null}).eq('id',id).eq('driver_id',me.id)))close()};
 if(g('#ed'))g('#ed').onclick=()=>svcDlg(id);
 if(g('#pr'))g('#pr').onclick=()=>printSheet(id);
}

function admin(){
 let b;
 if(adm==='lines')b=`<div class="row" style="justify-content:space-between;margin-bottom:8px"><p class="sub" style="margin:0">${L.length} lignes</p><button class="btn p" onclick="lineDlg()">Ajouter une ligne</button></div>`+L.map(x=>`<div class="sv" style="cursor:default">${lb(x.code)}<div class="i"><b>${esc(x.terminus_a||'?')} ⇄ ${esc(x.terminus_b||'?')}</b><small>${ST.filter(s=>s.line_code===x.code).length} arrêts intermédiaires</small></div><button class="btn" onclick="lineDlg('${esc(x.code)}')">Modifier</button></div>`).join('');
 else if(adm==='services')b=`<div class="row" style="justify-content:space-between;margin-bottom:8px"><p class="sub" style="margin:0">${SV.length} services</p><button class="btn p" onclick="svcDlg()">Ajouter un service</button></div>`+SV.map(s=>`<div class="sv" style="cursor:default">${lb(s.line_code)}<div class="i"><b>Service ${esc(s.id)}</b> · ${fd(s.day)}<small>${hm(s.start_time)} – ${hm(s.end_time)} · ${s.driver_id&&PR[s.driver_id]?esc(PR[s.driver_id].prenom+' '+PR[s.driver_id].nom):'À pourvoir'}</small></div><button class="btn" onclick="svcDlg('${esc(s.id)}')">Modifier</button></div>`).join('');
 else b=Object.values(PR).map(p=>`<div class="sv" style="cursor:default"><div class="i"><b>${esc(p.prenom)} ${esc(p.nom)}</b><small>${esc(p.matricule)} · ${p.role==='admin'?'administrateur':'conducteur'}</small></div>${p.id===me.id?'':`<button class="btn" data-role="${p.id}" data-to="${p.role==='admin'?'driver':'admin'}">${p.role==='admin'?'Retirer admin':'Passer admin'}</button>`}</div>`).join('');
 const T=(k,t)=>`<button data-a="${k}" class="${adm===k?'on':''}">${t}</button>`;
 return `<h1>Administration</h1><p class="sub">Lignes, terminus, arrêts, services et conducteurs.</p><div class="tabs" id="at">${T('lines','Lignes')}${T('services','Services')}${T('users','Conducteurs')}</div><div class="card">${b}</div>`;
}
function lineDlg(code){
 const x=code?L.find(y=>y.code===code):{code:'',bg:'#3b82f6',fg:'#111111',terminus_a:'',terminus_b:''};
 const names=code?ST.filter(s=>s.line_code===code).map(s=>s.name).join('\n'):'';
 dlg(`<h2>${code?'Modifier la ligne '+esc(code):'Ajouter une ligne'}</h2><form id="lf"><div class="row"><label>Code<br><input id="l1" value="${esc(x.code)}" placeholder="ex. L7"></label><label>Fond<br><input id="l2" type="color" value="${esc(x.bg)}"></label><label>Texte<br><input id="l3" type="color" value="${esc(x.fg)}"></label></div><div class="two"><label>Terminus de départ<input id="l4" value="${esc(x.terminus_a)}" style="width:100%"></label><label>Terminus d’arrivée<input id="l5" value="${esc(x.terminus_b)}" style="width:100%"></label></div><label>Arrêts intermédiaires (un par ligne, dans l’ordre)<textarea id="l6">${esc(names)}</textarea></label><p class="err" id="le" role="alert"></p><div class="row" style="justify-content:flex-end">${code?'<button type="button" class="btn" id="ld" style="color:var(--rd);margin-right:auto">Supprimer</button>':''}<button type="button" class="btn" onclick="close()">Annuler</button><button class="btn p">Enregistrer</button></div></form>`);
 const er=m=>$('#le').textContent=m;
 $('#lf').onsubmit=async e=>{e.preventDefault();
  const c=$('#l1').value.replace(/[^A-Za-z0-9-]/g,'').toUpperCase();
  if(!c)return er('Saisis un code de ligne.');
  if(c!==code&&L.some(y=>y.code===c))return er('Cette ligne existe déjà.');
  const o={code:c,bg:$('#l2').value,fg:$('#l3').value,terminus_a:$('#l4').value.trim(),terminus_b:$('#l5').value.trim()};
  let r=await(code&&c!==code?sb.from('lines').update(o).eq('code',code):sb.from('lines').upsert(o));
  if(r.error)return er(r.error.message);
  r=await sb.from('stops').delete().eq('line_code',c);if(r.error)return er(r.error.message);
  const n=$('#l6').value.split('\n').map(v=>v.trim()).filter(Boolean);
  if(n.length){r=await sb.from('stops').insert(n.map((name,i)=>({line_code:c,pos:i+1,name})));if(r.error)return er(r.error.message)}
  close();await load();render();
 };
 const d=$('#ld');if(d)twice(d,async()=>{if(await act(sb.from('lines').delete().eq('code',code)))close()});
}
function svcDlg(id){
 const s=id?SV.find(x=>x.id===id):{id:'',line_code:L[0]?L[0].code:'',day:today(),start_time:'08:00',end_time:'12:00',detail:'Dépôt · 1 tour',driver_id:null};
 dlg(`<h2>${id?'Modifier':'Ajouter'} un service</h2><form id="sf"><div class="row"><label>Numéro<br><input id="s1" value="${esc(s.id)}" ${id?'readonly':''}></label><label>Ligne<br><select id="s2">${L.map(x=>`<option ${x.code===s.line_code?'selected':''}>${esc(x.code)}</option>`).join('')}</select></label><label>Jour<br><input id="s3" type="date" value="${esc(s.day)}"></label></div><div class="row"><label>Début<br><input id="s4" type="time" value="${hm(s.start_time)}"></label><label>Fin<br><input id="s5" type="time" value="${hm(s.end_time)}"></label></div><label>Détail<input id="s6" value="${esc(s.detail)}" style="width:100%"></label><label>Conducteur<br><select id="s7"><option value="">À pourvoir</option>${Object.values(PR).map(p=>`<option value="${p.id}" ${p.id===s.driver_id?'selected':''}>${esc(p.prenom+' '+p.nom)}</option>`).join('')}</select></label><p class="err" id="se" role="alert"></p><div class="row" style="justify-content:flex-end">${id?'<button type="button" class="btn" id="sd" style="color:var(--rd);margin-right:auto">Supprimer</button>':''}<button type="button" class="btn" onclick="close()">Annuler</button><button class="btn p">Enregistrer</button></div></form>`);
 const er=m=>$('#se').textContent=m;
 $('#sf').onsubmit=async e=>{e.preventDefault();
  const n=$('#s1').value.replace(/[^A-Za-z0-9-]/g,'');
  if(!n)return er('Renseigne un numéro de service.');
  if(!id&&SV.some(x=>x.id===n))return er('Ce numéro existe déjà.');
  if(!$('#s2').value)return er('Crée d’abord une ligne.');
  const r=await sb.from('services').upsert({id:n,line_code:$('#s2').value,day:$('#s3').value,start_time:$('#s4').value,end_time:$('#s5').value,detail:$('#s6').value.trim(),driver_id:$('#s7').value||null});
  if(r.error)return er(r.error.message);
  close();await load();render();
 };
 const d=$('#sd');if(d)twice(d,async()=>{if(await act(sb.from('services').delete().eq('id',id)))close()});
}

function sheet(id){
 const s=SV.find(x=>x.id===id);if(!s)return false;
 const l=L.find(x=>x.code===s.line_code)||{},pts=[l.terminus_a,...ST.filter(x=>x.line_code===s.line_code).map(x=>x.name),l.terminus_b].filter(Boolean),p=PR[s.driver_id]||me;
 const jour=new Date(s.day+'T12:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 $('#sheet').innerHTML=`<div class="sh"><div class="shh"><div><h1>LogiRide · Trans'Cab</h1><p>Feuille de service</p></div><div class="shn"><small>SERVICE</small><b>${esc(s.id)}</b></div></div>
 <div class="shg"><div><small>Ligne</small>${lb(s.line_code)}</div><div><small>Jour</small><b>${esc(jour)}</b></div><div><small>Conducteur</small><b>${esc((p.prenom||'')+' '+(p.nom||''))}</b><br>${esc(p.matricule||'')}</div><div><small>N° de voiture</small></div></div>
 <div class="shg"><div><small>Prise de service</small><b>${hm(s.start_time)}</b></div><div><small>Fin de service</small><b>${hm(s.end_time)}</b></div><div><small>Amplitude</small><b>${amp(s.start_time,s.end_time)}</b></div><div><small>Détail</small><b>${esc(s.detail||'')}</b></div></div>
 <table><thead><tr><th style="width:40px">N°</th><th>Arrêt</th><th style="width:160px">Position</th></tr></thead><tbody>${pts.length?pts.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x)}</td><td>${i===0?'Terminus de départ':i===pts.length-1?'Terminus d’arrivée':''}</td></tr>`).join(''):'<tr><td colspan="3">Aucun arrêt défini pour cette ligne.</td></tr>'}</tbody></table>
 <div class="shs"><div><small>Observations</small></div><div><small>Signature du conducteur</small></div><div><small>Visa régulation</small></div></div>
 <div class="shf"><span>Édité le ${new Date().toLocaleString('fr-FR')} · Ligne ${esc(s.line_code)} · Service ${esc(s.id)}</span><span>LogiRide version 0.2 beta &copy; LogiSync</span></div></div>`;
 return true;
}
function printSheet(id){if($('#dlg').open)close();if(!sheet(id))return;document.body.classList.add('ps');setTimeout(()=>window.print(),60)}
function profil(){
 const h=hours();
 return `<h1>Mon compte LogiRide</h1><p class="sub">Ces informations sont visibles de l’équipe et de l'administration LogiRide.</p><div class="stats" style="max-width:480px"><div><small>Ce mois-ci</small><b>${fh(h.mois)}</b></div><div><small>Total effectué</small><b>${fh(h.total)}</b></div><div><small>À venir</small><b>${fh(h.venir)}</b></div></div><div class="card" style="max-width:480px"><form id="pf"><div class="two"><label>Prénom<input id="p1" value="${esc(me.prenom)}" style="width:100%"></label><label>Nom<input id="p2" value="${esc(me.nom)}" style="width:100%"></label></div><label>Matricule<input id="p3" value="${esc(me.matricule)}" style="width:100%" ${me.role==='admin'?'':'readonly'}></label>${me.role==='admin'?'':'<p class="sub" style="margin:-4px 0 12px;font-size:13px">Le matricule ne peut être modifié que par un administrateur.</p>'}<p class="sub" style="margin:0 0 12px">Rôle : ${me.role==='admin'?'administrateur':'conducteur'}</p><p class="err" id="pm" role="alert"></p><button class="btn p">Enregistrer</button></form></div>`;
}
function render(){
 if(!me){authView();return}
 const r=view();
 if(r==='quitter'){me=null;sb.auth.signOut().then(()=>{location.hash='journee';render()});return}
 const v=NAV.some(n=>n[0]===r)||(r==='admin'&&me.role==='admin')||r==='profil'?r:'journee';
 nav(v);$('#app').innerHTML=({journee,services,planning,heures,messages,admin,profil})[v]();
 $('#app').insertAdjacentHTML('beforeend',FOOT);
 document.querySelectorAll('.sv[data-id],.chip[data-id],.js[data-id]').forEach(e=>{e.onclick=()=>detail(e.dataset.id);e.onkeydown=k=>{if(k.key==='Enter')e.click()}});
 document.querySelectorAll('.tabs button[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
 document.querySelectorAll('#at button').forEach(b=>b.onclick=()=>{adm=b.dataset.a;render()});
 document.querySelectorAll('[data-mp]').forEach(b=>b.onclick=()=>{pmo+=+b.dataset.mp;render()});
 document.querySelectorAll('[data-mh]').forEach(b=>b.onclick=()=>{hmo+=+b.dataset.mh;render()});
 document.querySelectorAll('[data-pr]').forEach(b=>b.onclick=e=>{e.stopPropagation();printSheet(b.dataset.pr)});
 const cb=$('#csv');if(cb)cb.onclick=csv;const pb=$('#prt');if(pb)pb.onclick=()=>window.print();
 document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>act(sb.from('profiles').update({role:b.dataset.to}).eq('id',b.dataset.role)));
 const f=$('#fl');if(f)f.onchange=()=>{fl=f.value;render()};
 const pf=$('#pf');if(pf)pf.onsubmit=async e=>{e.preventDefault();const o={prenom:$('#p1').value.trim(),nom:$('#p2').value.trim()};if(me.role==='admin')o.matricule=$('#p3').value.trim().toUpperCase();if(!o.prenom||!o.nom||(me.role==='admin'&&!o.matricule)){$('#pm').textContent='Renseigne ton prénom, ton nom et ton matricule.';return}const{error}=await sb.from('profiles').update(o).eq('id',me.id);if(error){$('#pm').textContent=error.message;return}Object.assign(me,o);await load();render();toast('Profil enregistré.',1)};
 const mf=$('#mf');if(mf){paintMsgs();mf.onsubmit=async e=>{e.preventDefault();const i=$('#mi'),t=i.value.trim();if(!t)return;
  const{error}=await sb.from('messages').insert({author_id:me.id,author_name:(me.prenom+' '+me.nom).trim(),body:t,important:!!($('#mx')&&$('#mx').checked)});
  if(error)toast(error.message);else i.value=''}}
}

let tk=0;
function tick(){
 const n=new Date(),t=n.toLocaleTimeString('fr-FR'),c=$('#clock');
 if(c)c.innerHTML='<b>'+t.slice(0,5)+'<i style="font-size:17px;font-weight:600;color:var(--mu);font-style:normal">'+t.slice(5)+'</i></b><span>'+n.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})+'</span>';
 if(++tk%60===0&&me&&['journee','services','planning','heures','profil'].includes(view())&&!$('#dlg').open&&!document.activeElement.matches('input,select,textarea'))render();
}
tick();setInterval(tick,1000);
window.addEventListener('afterprint',()=>document.body.classList.remove('ps'));
window.addEventListener('hashchange',render);
sb.auth.getSession().then(({data})=>data.session?enter(data.session.user.id):render());
</script>
